[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alexs-gold-md-code"
version = "0.1.0"
description = "Molecular dynamics simulation of gold using an EAM potential"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy"]

[tool.hatch.build.targets.wheel]
packages = ["src/gold_md"]

[tool.hatch.build.targets.wheel.force-include]
"src/gold_md/Au-Grochola-JCP05.eam.alloy" = "gold_md/Au-Grochola-JCP05.eam.alloy"
