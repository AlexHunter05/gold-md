[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gold-md"
version = "0.1.0"
description = "Molecular dynamics simulations using embedded atom method potentials"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy"
]

[tool.setuptools.packages.find]
where = ["src"]
